{% extends "base.html" %}
{% block content %}

<div style="display:flex; justify-content:center; align-items:center; min-height:70vh;">
  <div style="position:relative; width:720px; max-width:90vw; background:white; border-radius:12px; padding:24px; box-shadow:0 10px 30px rgba(0,0,0,0.12); text-align:center;">

    <a href="{% url 'posts:feed' %}"
       style="position:absolute; right:18px; top:14px; font-size:22px; text-decoration:none; color:#333;">
      ×
    </a>

    <div style="margin-bottom:12px; color:#444;">
      {{ story.user.username }}
    </div>

    <div style="position:relative; display:flex; justify-content:center; align-items:center;">
      {% if prev_url %}
        <a href="{{ prev_url }}"
           style="position:absolute; left:-10px; top:50%; transform:translateY(-50%);
                  font-size:48px; text-decoration:none; color:#333; padding:6px 10px;">‹</a>
      {% else %}
        <a href="{% url 'posts:feed' %}"
           style="position:absolute; left:-10px; top:50%; transform:translateY(-50%);
                  font-size:48px; text-decoration:none; color:#333; padding:6px 10px;">‹</a>
      {% endif %}

      <img src="{{ item.image.url }}" alt="story"
           style="max-width:520px; width:70vw; height:auto; border-radius:10px;">

      {% if next_url %}
        <a href="{{ next_url }}"
           style="position:absolute; right:-10px; top:50%; transform:translateY(-50%);
                  font-size:48px; text-decoration:none; color:#333; padding:6px 10px;">›</a>
      {% else %}
        <a href="{% url 'posts:feed' %}"
           style="position:absolute; right:-10px; top:50%; transform:translateY(-50%);
                  font-size:48px; text-decoration:none; color:#333; padding:6px 10px;">›</a>
      {% endif %}
    </div>

  </div>
</div>

{% endblock %}
