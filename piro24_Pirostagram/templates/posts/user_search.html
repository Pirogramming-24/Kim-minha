<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>User Search</title>
</head>
<body>
  <a href="{% url 'posts:feed' %}">Back</a>
  <hr>

  <form method="get">
    <input name="q" value="{{ q }}" placeholder="username / name">
    <button type="submit">Search</button>
  </form>

  <hr>

  <ul>
    {% for u in results %}
      <li>
        <a href="{% url 'posts:profile' u.username %}">{{ u.username }}</a>
        {% if u.first_name or u.last_name %}
          ({{ u.first_name }} {{ u.last_name }})
        {% endif %}
      </li>
    {% empty %}
      {% if q %}
        <li>No results</li>
      {% endif %}
    {% endfor %}
  </ul>
</body>
</html>
