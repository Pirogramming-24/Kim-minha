<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}Pirostagram{% endblock %}</title>
  <style>
    body { margin:0; font-family: Arial, sans-serif; }
    .layout { display:flex; min-height:100vh; }
    .sidebar {
      width:240px; border-right:1px solid #eee; padding:24px 16px;
      box-sizing:border-box;
    }
    .brand { font-size:32px; font-weight:700; color:#8bc34a; margin-bottom:24px; }
    .nav a { display:flex; gap:10px; align-items:center; padding:10px 8px; text-decoration:none; color:#111; border-radius:10px; }
    .nav a:hover { background:#f6f6f6; }
    .main { flex:1; padding:24px; box-sizing:border-box; }
    .storybar { display:flex; gap:16px; align-items:flex-start; overflow-x:auto; padding-bottom:8px; }
  .story-item { width:86px; text-align:center; font-size:12px; color:#333; flex:0 0 auto; }

  .avatar-circle {
    width:68px; height:68px; border-radius:50%;
    border:2px solid #ddd;
    display:flex; align-items:center; justify-content:center;
    background:#f6f6f6;
    font-weight:700; color:#555;
    user-select:none; }
    .btn { padding:8px 12px; border:1px solid #ddd; border-radius:10px; background:white; cursor:pointer; }
    .btn:hover { background:#f6f6f6; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">Pirostagram</div>

      <nav class="nav">
        <a href="{% url 'posts:feed' %}">홈</a>
        <a href="{% url 'posts:user_search' %}">유저 검색</a>
        <a href="{% url 'posts:create' %}">게시글 만들기</a>
        <a href="{% url 'posts:profile' user.username %}">프로필</a>
      </nav>

      <div style="margin-top:18px;">
        <form action="{% url 'logout' %}" method="post">
          {% csrf_token %}
          <button class="btn" type="submit">로그아웃</button>
        </form>
      </div>
    </aside>

    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
