{% extends "base.html" %}
{% block title %}회원가입 | LilyAI.kr{% endblock %}

{% block content %}
  <div class="main-header">
    <div class="title">회원가입</div>
    <div class="hint">가입 후 자동 로그인됩니다.</div>
  </div>

  <div class="chat">
    <form method="post" class="bubble assistant" style="max-width:560px;">
      {% csrf_token %}

      {% if form.errors %}
        <div style="color: rgba(255,107,107,.95); margin-bottom:10px;">
          입력을 다시 확인해 주세요.
        </div>
      {% endif %}

      <div style="display:flex; flex-direction:column; gap:10px;">
        <input name="username" value="{{ form.username.value|default:'' }}" required
          placeholder="Username"
          style="width:100%; height:42px; padding:10px 12px; border-radius:12px;
                 border:1px solid rgba(255,255,255,.12); background:rgba(0,0,0,.15); color:rgba(255,255,255,.92);">

        <input type="password" name="password1" required
          placeholder="Password"
          style="width:100%; height:42px; padding:10px 12px; border-radius:12px;
                 border:1px solid rgba(255,255,255,.12); background:rgba(0,0,0,.15); color:rgba(255,255,255,.92);">

        <input type="password" name="password2" required
          placeholder="Password 확인"
          style="width:100%; height:42px; padding:10px 12px; border-radius:12px;
                 border:1px solid rgba(255,255,255,.12); background:rgba(0,0,0,.15); color:rgba(0,0,0,.15); color:rgba(255,255,255,.92);">

        <input type="hidden" name="next" value="{{ next }}">

        <button type="submit"
          style="height:44px; border-radius:12px; border:1px solid rgba(122,162,255,.35);
                 background:rgba(122,162,255,.18); color:rgba(255,255,255,.92); cursor:pointer;">
          가입하기
        </button>

        <div style="margin-top:6px; font-size:13px; opacity:.85;">
          이미 계정이 있으면
          <a href="/accounts/login/?next={{ next|urlencode }}" style="text-decoration:underline;">로그인</a>
        </div>
      </div>
    </form>
  </div>
{% endblock %}
